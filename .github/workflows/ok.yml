name: Android Build & Firebase Test Lab 20
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-run:
    # macOS runners support hardware acceleration (HAXM), which is required to run the emulator smoothly
    runs-on: macos-13

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant Execute Permission to Gradlew
      run: chmod +x ./gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Run APK on Emulator & Capture Logs
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 33
        target: google_apis
        arch: x86_64
        script: |
          echo "=== Launching App ==="
          # 1. Install your freshly built APK
          adb install app/build/outputs/apk/debug/app-debug.apk
          
          # 2. Start your app's main activity (Replace com.example.myapp with your actual package structure)
          adb shell monkey -p com.example.myapp -c android.intent.category.LAUNCHER 1
          
          # 3. Wait a few seconds for the app to initialize and run
          sleep 5
          
          # 4. Dump the real-time runtime logcat logs directly to the GitHub console
          echo "=== Streaming Android Logcat Runtime Logs ==="
          adb logcat -d *:I
